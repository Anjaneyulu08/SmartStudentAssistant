<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Student Assistant - Login</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f3f6fb;
            color: #111827;
        }


        .auth-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }


        .auth-card {
            width: 100%;
            max-width: 430px;

            background: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 18px;

            padding: 36px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.08);
        }


        .auth-logo {
            width: 60px;
            height: 60px;

            margin: 0 auto 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eff6ff;

            border-radius: 15px;

            font-size: 30px;
        }


        .auth-card > h1 {
            margin: 0;

            text-align: center;

            color: #111827;

            font-size: 23px;
            font-weight: 700;
        }


        .auth-subtitle {
            margin: 8px 0 30px;

            text-align: center;

            color: #6b7280;

            font-size: 13px;
        }


        .auth-card h2 {
            margin: 0 0 7px;

            color: #111827;

            font-size: 20px;
        }


        .auth-description {
            margin: 0 0 22px;

            color: #6b7280;

            font-size: 13px;
        }


        .auth-input-group {
            margin-bottom: 16px;
        }


        .auth-input-group label {
            display: block;

            margin-bottom: 7px;

            color: #374151;

            font-size: 13px;
            font-weight: 600;
        }


        .auth-input-group input {
            width: 100%;

            padding: 12px 13px;

            border: 1px solid #d1d5db;
            border-radius: 9px;

            background: #ffffff;

            color: #111827;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .auth-input-group input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }


        .auth-button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 9px;

            background: #2563eb;

            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .auth-button:hover {
            background: #1d4ed8;

            transform: translateY(-1px);
        }


        .auth-message {
            min-height: 18px;

            margin: 12px 0 0;

            text-align: center;

            font-size: 13px;
        }


        .auth-switch {
            margin: 22px 0 0;

            text-align: center;

            color: #6b7280;

            font-size: 13px;
        }


        .auth-switch button {
            padding: 0;

            border: none;

            background: transparent;

            color: #2563eb;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
        }


        .auth-switch button:hover {
            text-decoration: underline;
        }


        @media (max-width: 500px) {

            .auth-page {
                padding: 15px;
            }


            .auth-card {
                padding: 26px 20px;

                border-radius: 14px;
            }


            .auth-card > h1 {
                font-size: 20px;
            }

        }

    </style>

</head>


<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                🎓
            </div>


            <h1>
                Smart Student Assistant
            </h1>


            <p class="auth-subtitle">
                Your personal academic companion
            </p>


            <!-- LOGIN -->

            <div id="login-form">

                <h2>
                    Welcome Back
                </h2>


                <p class="auth-description">
                    Login to continue to your dashboard.
                </p>


                <div class="auth-input-group">

                    <label for="login-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="auth-input-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                    >

                </div>


                <button
                    id="login-button"
                    class="auth-button"
                >
                    Login
                </button>


                <p
                    id="login-message"
                    class="auth-message">
                </p>


                <p class="auth-switch">

                    Don't have an account?

                    <button
                        type="button"
                        id="show-register"
                    >
                        Create Account
                    </button>

                </p>

            </div>


            <!-- REGISTER -->

            <div
                id="register-form"
                style="display: none;"
            >

                <h2>
                    Create Account
                </h2>


                <p class="auth-description">
                    Create your student account.
                </p>


                <div class="auth-input-group">

                    <label for="register-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="register-name"
                        placeholder="Enter your name"
                    >

                </div>


                <div class="auth-input-group">

                    <label for="register-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="auth-input-group">

                    <label for="register-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Create a password"
                    >

                </div>


                <div class="auth-input-group">

                    <label for="register-confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="register-confirm-password"
                        placeholder="Confirm your password"
                    >

                </div>


                <button
                    id="register-button"
                    class="auth-button"
                >
                    Create Account
                </button>


                <p
                    id="register-message"
                    class="auth-message">
                </p>


                <p class="auth-switch">

                    Already have an account?

                    <button
                        type="button"
                        id="show-login"
                    >
                        Login
                    </button>

                </p>

            </div>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
